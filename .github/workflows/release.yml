name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check release conditions
        id: check
        run: |
          # Check if current commit has a semver tag
          TAG=$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1)

          # Check if commit is on main
          ON_MAIN=$(git branch -r --contains HEAD | grep -q 'origin/main' && echo "true" || echo "false")

          if [ -z "$TAG" ]; then
            echo "No release tag found on this commit"
            echo "should_release=false" >> $GITHUB_OUTPUT
          elif [ "$ON_MAIN" != "true" ]; then
            echo "Tagged commit is not on main branch yet"
            echo "should_release=false" >> $GITHUB_OUTPUT
          else
            echo "Found release tag on main: $TAG"
            echo "should_release=true" >> $GITHUB_OUTPUT
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.check.outputs.should_release == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        if: steps.check.outputs.should_release == 'true'
        run: npm ci

      - name: Stamp tested-up-to WordPress version
        if: steps.check.outputs.should_release == 'true'
        run: |
          set -euo pipefail
          # .wp-env.json pins no core version, so the e2e suite runs against
          # whatever wordpress.org currently ships - and test.yml fails if that
          # stops being true. Record it, so the plugin screen stops saying
          # "compatibility with WordPress x.x: not tested".
          WP=$(curl -sf https://api.wordpress.org/core/version-check/1.7/ \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).offers[0].current))')
          test -n "$WP"
          sed -i -E "s|('tested' => ')[^']*(')|\1${WP}\2|" soli-featured-image-plugin.php
          if ! grep -qF -- "'tested' => '${WP}'" soli-featured-image-plugin.php; then
            echo "::error::failed to stamp tested-up-to ${WP}"
            exit 1
          fi
          echo "Stamped tested-up-to WordPress $WP."

      - name: Build package
        if: steps.check.outputs.should_release == 'true'
        run: |
          # The block build output is not committed, so it has to be built
          # before publish.js zips it up.
          npm run build
          node ./publish.js

      - name: Generate release notes
        if: steps.check.outputs.should_release == 'true'
        run: |
          # Get previous tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -z "$PREV_TAG" ]; then
            # First release, get all commits
            COMMITS=$(git log --pretty=format:"- %s" --no-merges)
          else
            # Get commits since previous tag
            COMMITS=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s" --no-merges)
          fi

          # Write to file for multiline output
          echo "## Changes" > release_notes.md
          echo "" >> release_notes.md
          echo "$COMMITS" >> release_notes.md
          echo "" >> release_notes.md
          echo "---" >> release_notes.md
          echo "" >> release_notes.md
          echo "**Full Changelog:** https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${{ steps.check.outputs.tag }}" >> release_notes.md

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.check.outputs.tag }}" \
            --title "Release ${{ steps.check.outputs.version }}" \
            --notes-file release_notes.md \
            *.zip
